<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympiad Practice Quiz</title>
<style>
  :root { --bg:#f7f8fb; --card:#fff; --text:#1d2433; --muted:#5b6475; --accent:#3563e9;
          --ok:#1f9d55; --okbg:#e5f6ec; --bad:#d64545; --badbg:#fbeaea; --line:#dde2ea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141821; --card:#1d2230; --text:#e8ebf2; --muted:#9aa3b5;
      --accent:#7c9cff; --ok:#4cd08a; --okbg:#1c3528; --bad:#ff7b7b; --badbg:#3a2224; --line:#2e3547; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  header p { color:var(--muted); margin:4px 0 0; }
  h1 { margin:0; font-size:1.6rem; }
  select { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--text); margin-top:12px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .q h2 { font-size:1.05rem; font-weight:600; margin:0 0 12px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:480px) { .opts { grid-template-columns:1fr; } }
  button.opt { font:inherit; text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer;
               border:1px solid var(--line); background:transparent; color:var(--text); }
  button.opt:hover:not(:disabled) { border-color:var(--accent); }
  button.opt:disabled { cursor:default; }
  .opt.correct { background:var(--okbg); border-color:var(--ok); }
  .opt.wrong { background:var(--badbg); border-color:var(--bad); }
  .fb { margin-top:10px; font-weight:600; min-height:1.5em; }
  .fb.ok { color:var(--ok); } .fb.bad { color:var(--bad); }
  .bar { position:sticky; bottom:0; margin-top:24px; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  .bar button { font:inherit; padding:8px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Olympiad Practice</h1>
    <p id="sub"></p>
    <select id="chapter" aria-label="Choose chapter"></select>
  </header>
  <div id="quiz"></div>
  <div class="bar"><span id="score">Score: 0 / 0</span><button id="reset">Try again</button></div>
</main>
<script>
// Add new chapters to this list. "answer" is the index of the correct option (0 = A).
const CHAPTERS = [
  {
    cls: "Class 3", chapter: 1, title: "Me and My Surroundings",
    questions: [
      { q: "While going to the school, Ajay saw that his shoe sole was peeling off. To whom should he go to repair his shoe?",
        options: ["Carpenter", "Tailor", "Barber", "Cobbler"], answer: 3 },
      { q: "The voice box helps us to speak, make sound and sing. Where is it found?",
        options: ["Chest", "Throat", "Head", "Foot"], answer: 1 },
      { q: "Which of the following organs helps to remove waste and extra fluid from our body?",
        options: ["Lungs", "Heart", "Kidneys", "Liver"], answer: 2 },
      { q: "Mr. Gupta works in a laboratory. He conducts experiments and does research to discover/invent new things. He is a ______.",
        options: ["Astrologer", "Scientist", "Journalist", "Electrician"], answer: 1 },
      { q: "Which of the following organs covers the windpipe to prevent the entry of food in windpipe while swallowing food?",
        options: ["Oesophagus", "Epiglottis", "Larynx", "Ear"], answer: 1 },
      { q: "We consume various products of milk. Which among these items is NOT obtained from milk?",
        options: ["Curd", "Cream", "Butter", "Cereal"], answer: 3 },
      { q: "Anita Kaul designs houses and buildings. She is a/an ______.",
        options: ["Architect", "Conductor", "Mechanic", "Pilot"], answer: 0 },
    ],
  },
];

const $ = id => document.getElementById(id);
let current = 0, score = 0, done = 0;

CHAPTERS.forEach((c, i) => $("chapter").add(new Option(`${c.cls} · Chapter ${c.chapter}: ${c.title}`, i)));
$("chapter").onchange = e => { current = +e.target.value; render(); };
$("reset").onclick = render;

function render() {
  const c = CHAPTERS[current];
  score = 0; done = 0;
  $("title").textContent = `Chapter ${c.chapter}: ${c.title}`;
  $("sub").textContent = `${c.cls} · Test Skills · ${c.questions.length} questions`;
  $("quiz").innerHTML = "";
  c.questions.forEach((item, qi) => {
    const box = document.createElement("section");
    box.className = "q";
    box.innerHTML = `<h2>${qi + 1}. ${item.q}</h2><div class="opts"></div><div class="fb"></div>`;
    const opts = box.querySelector(".opts"), fb = box.querySelector(".fb");
    item.options.forEach((o, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = `(${"ABCD"[oi]}) ${o}`;
      b.onclick = () => {
        const buttons = opts.querySelectorAll("button");
        buttons.forEach(x => x.disabled = true);
        buttons[item.answer].classList.add("correct");
        done++;
        if (oi === item.answer) { score++; fb.textContent = "Correct!"; fb.className = "fb ok"; }
        else { b.classList.add("wrong"); fb.textContent = `Not correct. The answer is (${"ABCD"[item.answer]}) ${item.options[item.answer]}.`; fb.className = "fb bad"; }
        updateScore();
      };
      opts.appendChild(b);
    });
    $("quiz").appendChild(box);
  });
  updateScore();
}
function updateScore() {
  const n = CHAPTERS[current].questions.length;
  $("score").textContent = `Score: ${score} / ${done}` + (done === n ? ` — finished!` : "");
}
render();
</script>
</body>
</html>
