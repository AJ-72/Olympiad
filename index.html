<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympiad Practice Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header>
    <h1 id="title">Olympiad Practice</h1>
    <p id="sub"></p>
    <select id="chapter" aria-label="Choose chapter"></select>
    <p class="small"><a href="admin.html">Add a chapter</a></p>
  </header>
  <div id="quiz"></div>
  <div class="bar"><span id="score">Score: 0 / 0</span><button id="reset">Try again</button></div>
</main>
<script>
let CHAPTERS = [];
const load = DATA => DATA.chapters.map(c => ({ ...c, cls: c.class,
  questions: c.questions.map(q => ({ ...q, answer: "ABCD".indexOf(q.answer) })) }));

const $ = id => document.getElementById(id);
let current = 0, score = 0, done = 0;

$("chapter").onchange = e => { current = +e.target.value; render(); };
$("reset").onclick = render;

function render() {
  const c = CHAPTERS[current];
  score = 0; done = 0;
  $("title").textContent = `Chapter ${c.chapter}: ${c.title}`;
  $("sub").textContent = `${c.cls} · Test Skills · ${c.questions.length} questions`;
  $("quiz").innerHTML = "";
  c.questions.forEach((item, qi) => {
    const box = document.createElement("section");
    box.className = "q";
    box.innerHTML = `<h2></h2><div class="opts"></div><div class="fb"></div>`;
    box.querySelector("h2").textContent = `${qi + 1}. ${item.q}`;
    const opts = box.querySelector(".opts"), fb = box.querySelector(".fb");
    item.options.forEach((o, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = `(${"ABCD"[oi]}) ${o}`;
      b.onclick = () => {
        const buttons = opts.querySelectorAll("button");
        buttons.forEach(x => x.disabled = true);
        buttons[item.answer].classList.add("correct");
        done++;
        if (oi === item.answer) { score++; fb.textContent = "Correct!"; fb.className = "fb ok"; }
        else { b.classList.add("wrong"); fb.textContent = `Not correct. The answer is (${"ABCD"[item.answer]}) ${item.options[item.answer]}.`; fb.className = "fb bad"; }
        updateScore();
      };
      opts.appendChild(b);
    });
    $("quiz").appendChild(box);
  });
  updateScore();
}
function updateScore() {
  const n = CHAPTERS[current].questions.length;
  $("score").textContent = `Score: ${score} / ${done}` + (done === n ? ` — finished!` : "");
}
fetch("data/questions.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    CHAPTERS = load(data);
    CHAPTERS.forEach((c, i) => $("chapter").add(new Option(`${c.cls} · Chapter ${c.chapter}: ${c.title}`, i)));
    if (CHAPTERS.length) render(); else $("sub").textContent = "No chapters yet.";
  })
  .catch(() => { $("sub").textContent = "Could not load the questions."; });
</script>
</body>
</html>
